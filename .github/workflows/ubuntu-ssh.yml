name: Ubuntu SSH - developpement et tests

on:
  workflow_dispatch:
    inputs:
      duration_minutes:
        description: 'Duree de session (1 a 330 minutes)'
        required: true
        default: '330'

permissions:
  contents: read

concurrency:
  group: ubuntu-ssh
  cancel-in-progress: false

jobs:
  development:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Valider la duree
        env:
          DURATION: ${{ inputs.duration_minutes }}
        run: |
          if ! [[ "$DURATION" =~ ^[0-9]{1,3}$ ]] || (( 10#$DURATION < 1 || 10#$DURATION > 330 )); then
            echo 'La duree doit etre comprise entre 1 et 330 minutes.'
            exit 1
          fi

      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Connecter Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
          hostname: ubuntu-dev-${{ github.run_id }}
          tailscaled-args: --tun=tailscale0
          args: --ssh

      - name: Afficher la connexion
        run: |
          IP=$(tailscale ip -4)
          {
            echo '## Ubuntu pret'
            echo 'Depuis ton ordinateur connecte a Tailscale :'
            echo '```sh'
            echo "ssh runner@$IP"
            echo '```'
            echo "Dossier du projet : $GITHUB_WORKSPACE"
            echo 'Sauvegarde ton travail avant la fin. Pour terminer plus tot : Cancel workflow.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Session de developpement
        env:
          DURATION: ${{ inputs.duration_minutes }}
        run: |
          END=$((SECONDS + 10#$DURATION * 60))
          while (( SECONDS < END )); do
            sleep 30
          done
